<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Anonymous Message</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      font-family: Arial, sans-serif;

      background:
        radial-gradient(circle at top left, #ffd6e7, transparent 35%),
        radial-gradient(circle at bottom right, #d8e7ff, transparent 35%),
        #fafafa;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      width: 100%;
      max-width: 400px;
      padding: 32px 25px;
      background: rgba(255,255,255,.94);
      border-radius: 24px;
      box-shadow: 0 15px 50px rgba(0,0,0,.12);
      text-align: center;
    }

    .icon {
      width: 70px;
      height: 70px;
      margin: auto auto 15px;
      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 32px;
      color: white;

      background: linear-gradient(
        135deg,
        #833ab4,
        #fd1d1d,
        #fcb045
      );
    }

    h1 {
      margin: 0;
      font-size: 27px;
    }

    .subtitle {
      color: #777;
      font-size: 14px;
      line-height: 21px;
      margin: 10px 0 22px;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 13px;
      margin-bottom: 12px;

      font-size: 14px;
      font-family: inherit;
      outline: none;
      background: #fafafa;
    }

    textarea {
      height: 120px;
      resize: none;
    }

    input:focus,
    textarea:focus {
      border-color: #9b59b6;
      background: white;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 13px;

      font-size: 15px;
      font-weight: bold;
      color: white;

      background: linear-gradient(
        135deg,
        #833ab4,
        #fd1d1d,
        #fcb045
      );

      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
    }

    #status {
      min-height: 20px;
      margin-top: 14px;
      font-size: 13px;
    }

    .success {
      color: #16803c;
    }

    .error {
      color: #d93025;
    }

    #conversation {
      display: none;
      margin-top: 25px;
      text-align: left;
    }

    .reply {
      background: #f1f1f1;
      border-radius: 14px;
      padding: 12px;
      margin-top: 10px;
      font-size: 14px;
      line-height: 20px;
    }

    .reply-title {
      font-size: 12px;
      color: #777;
      margin-bottom: 4px;
    }

    .credit {
      position: fixed;
      right: 15px;
      bottom: 12px;
      font-size: 11px;
      color: rgba(0,0,0,.45);
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="icon">💌</div>

    <h1>Send Me a Message</h1>

    <div class="subtitle">
      Say whatever you want.<br>
      Your message can be sent anonymously.
    </div>

    <form id="messageForm">

      <input
        id="name"
        type="text"
        maxlength="50"
        placeholder="Your name (optional)"
      >

      <textarea
        id="message"
        maxlength="2000"
        placeholder="Write your message..."
        required
      ></textarea>

      <button id="sendButton" type="submit">
        Send Message
      </button>

    </form>

    <div id="status"></div>

    <div id="conversation">
      <strong>💬 Reply</strong>
      <div id="replies"></div>
    </div>

  </div>

  <div class="credit">
    Created by Gourab
  </div>


<script>

const form = document.getElementById("messageForm");
const nameInput = document.getElementById("name");
const messageInput = document.getElementById("message");
const button = document.getElementById("sendButton");
const status = document.getElementById("status");
const conversation = document.getElementById("conversation");
const replies = document.getElementById("replies");


/*
  Give this visitor a random anonymous session ID.
  It does NOT contain their name or personal information.
*/

let sessionId = localStorage.getItem("anonymous_session");

if (!sessionId) {

  sessionId =
    crypto.randomUUID();

  localStorage.setItem(
    "anonymous_session",
    sessionId
  );
}


/* Send message */

form.addEventListener("submit", async function(event) {

  event.preventDefault();

  const name = nameInput.value.trim();
  const message = messageInput.value.trim();

  if (!message) return;

  button.disabled = true;
  button.textContent = "Sending...";
  status.textContent = "";

  try {

    const response = await fetch("/message", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        sessionId: sessionId,
        name: name,
        message: message
      })

    });

    const data = await response.json();

    if (response.ok && data.success) {

      messageInput.value = "";

      status.textContent =
        "Message sent! You can stay here for a reply.";

      status.className = "success";

      conversation.style.display = "block";

    } else {

      status.textContent =
        data.error || "Couldn't send the message.";

      status.className = "error";

    }

  } catch (error) {

    status.textContent =
      "Something went wrong. Please try again.";

    status.className = "error";

  }

  button.disabled = false;
  button.textContent = "Send Message";

});


/*
  Check for replies every 3 seconds.
*/

async function checkReplies() {

  try {

    const response = await fetch(
      "/replies/" + encodeURIComponent(sessionId)
    );

    if (!response.ok) return;

    const data = await response.json();

    if (!data.replies || data.replies.length === 0) {
      return;
    }

    conversation.style.display = "block";

    replies.innerHTML = "";

    data.replies.forEach(reply => {

      const box = document.createElement("div");

      box.className = "reply";

      box.innerHTML = `
        <div class="reply-title">💬 Reply</div>
        <div></div>
      `;

      box.querySelector("div:last-child")
        .textContent = reply;

      replies.appendChild(box);

    });

  } catch (error) {

    console.log("Reply check failed");

  }

}


setInterval(checkReplies, 3000);

</script>

</body>
</html>
