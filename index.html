<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Anonymous Chat</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  height: 100vh;
  font-family: Arial, sans-serif;
  background: #d7dbd5;
  display: flex;
  justify-content: center;
}

.app {
  width: 100%;
  max-width: 500px;
  height: 100vh;
  background: #efeae2;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* Header */

.header {
  height: 65px;
  background: #075e54;
  color: white;
  display: flex;
  align-items: center;
  padding: 10px 15px;
  gap: 12px;
}

.avatar {
  width: 43px;
  height: 43px;
  border-radius: 50%;
  background: #128c7e;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
}

.header-text {
  flex: 1;
}

.header-title {
  font-size: 16px;
  font-weight: bold;
}

.header-status {
  font-size: 12px;
  opacity: .8;
  margin-top: 3px;
}

/* Chat */

.chat {
  flex: 1;
  overflow-y: auto;
  padding: 15px 10px 90px;

  background-color: #efeae2;

  background-image:
    radial-gradient(
      rgba(0,0,0,.035) 1px,
      transparent 1px
    );

  background-size: 12px 12px;
}

/* Bubbles */

.message {
  display: flex;
  margin: 5px 0;
}

.message.received {
  justify-content: flex-start;
}

.message.sent {
  justify-content: flex-end;
}

.bubble {
  max-width: 78%;
  padding: 8px 10px 6px;
  border-radius: 8px;
  font-size: 14px;
  line-height: 20px;
  position: relative;
  word-wrap: break-word;
}

.received .bubble {
  background: white;
  border-top-left-radius: 2px;
}

.sent .bubble {
  background: #d9fdd3;
  border-top-right-radius: 2px;
}

.time {
  font-size: 10px;
  color: #667781;
  text-align: right;
  margin-top: 3px;
}

/* Welcome */

.welcome {
  text-align: center;
  margin: 15px auto 25px;
  max-width: 300px;
}

.welcome span {
  background: #fff3c4;
  padding: 6px 10px;
  border-radius: 7px;
  font-size: 11px;
  color: #667781;
}

/* Composer */

.composer {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;

  padding: 8px;

  background: #f0f2f5;

  display: flex;
  gap: 7px;
  align-items: center;
}

.name {
  position: absolute;
  bottom: 65px;
  left: 10px;
  right: 10px;
}

.name input {
  width: 100%;
  border: none;
  border-radius: 20px;
  padding: 10px 15px;
  outline: none;
}

.message-input {
  flex: 1;
  border: none;
  border-radius: 22px;
  padding: 12px 15px;
  font-size: 14px;
  outline: none;
  resize: none;
  max-height: 100px;
}

.send {
  width: 45px;
  height: 45px;
  border: none;
  border-radius: 50%;
  background: #075e54;
  color: white;
  font-size: 19px;
  cursor: pointer;
}

.send:disabled {
  opacity: .5;
}

.credit {
  position: fixed;
  bottom: 4px;
  right: 7px;
  font-size: 9px;
  color: rgba(0,0,0,.35);
}

/* Mobile */

@media (max-width: 500px) {

  .app {
    max-width: none;
  }

}
</style>
</head>

<body>

<div class="app">

  <div class="header">

    <div class="avatar">
      💬
    </div>

    <div class="header-text">

      <div class="header-title">
        Anonymous Chat
      </div>

      <div class="header-status">
        Send a message anonymously
      </div>

    </div>

  </div>


  <div class="chat" id="chat">

    <div class="welcome">
      <span>
        🔒 Messages are anonymous
      </span>
    </div>

  </div>


  <form id="form">

    <div class="composer">

      <textarea
        id="message"
        class="message-input"
        placeholder="Message"
        rows="1"
        required
      ></textarea>

      <button
        class="send"
        id="send"
        type="submit"
      >
        ➤
      </button>

    </div>

  </form>

</div>

<div class="credit">
  Created by Gourab
</div>


<script>

const chat =
  document.getElementById("chat");

const form =
  document.getElementById("form");

const message =
  document.getElementById("message");

const send =
  document.getElementById("send");


/*
 Create anonymous browser session.
*/

let sessionId =
  localStorage.getItem(
    "anonymous_session"
  );

if (!sessionId) {

  sessionId =
    crypto.randomUUID();

  localStorage.setItem(
    "anonymous_session",
    sessionId
  );

}


/*
 Escape HTML.
*/

function escapeHTML(text) {

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}


/*
 Add bubble.
*/

function addMessage(
  text,
  type,
  time
) {

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "message " + type;


  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";


  bubble.innerHTML = `
    <div>
      ${escapeHTML(text)}
    </div>

    <div class="time">
      ${time || ""}
    </div>
  `;


  wrapper.appendChild(bubble);

  chat.appendChild(wrapper);

  chat.scrollTop =
    chat.scrollHeight;

}


/*
 Load complete conversation.
*/

async function loadMessages() {

  try {

    const response =
      await fetch(
        "/conversation/" +
        encodeURIComponent(sessionId)
      );

    if (!response.ok) return;

    const data =
      await response.json();


    chat.innerHTML = `
      <div class="welcome">
        <span>
          🔒 Messages are anonymous
        </span>
      </div>
    `;


    data.messages.forEach(item => {

      addMessage(
        item.text,
        item.sender === "visitor"
          ? "sent"
          : "received",
        item.time
      );

    });


    chat.scrollTop =
      chat.scrollHeight;


  } catch (error) {

    console.log(error);

  }

}


/*
 Send message.
*/

form.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    const text =
      message.value.trim();

    if (!text) return;


    send.disabled = true;


    try {

      const response =
        await fetch("/message", {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            sessionId,
            message: text

          })

        });


      if (response.ok) {

        message.value = "";

        await loadMessages();

      }

    } catch (error) {

      console.log(error);

    }


    send.disabled = false;

  }
);


/*
 Check for new replies.
*/

setInterval(
  loadMessages,
  3000
);


/*
 Initial load.
*/

loadMessages();

</script>

</body>
</html>
