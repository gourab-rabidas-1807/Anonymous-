<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Anonymous Chat</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #0e1621;
      color: white;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* HEADER */

    .header {
      height: 64px;
      min-height: 64px;
      background: #17212b;
      display: flex;
      align-items: center;
      padding: 0 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,.35);
      z-index: 10;
    }

    .back {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      cursor: pointer;
    }

    .back:active {
      background: rgba(255,255,255,.1);
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg,#2196f3,#64b5f6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      margin-right: 11px;
    }

    .header-info {
      flex: 1;
      min-width: 0;
    }

    .header-name {
      font-size: 18px;
      font-weight: 600;
    }

    .header-status {
      font-size: 13px;
      margin-top: 3px;
      color: #9aa8b5;
    }

    .online {
      color: #55d66b;
    }

    .offline {
      color: #8c969f;
    }

    .menu {
      font-size: 27px;
      width: 40px;
      text-align: center;
    }

    /* CHAT */

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 12px 10px 82px;
      background-color: #0e1621;

      background-image:
        radial-gradient(
          circle at 20% 20%,
          rgba(255,255,255,.025) 0 2px,
          transparent 2px
        ),
        radial-gradient(
          circle at 80% 70%,
          rgba(255,255,255,.02) 0 2px,
          transparent 2px
        );

      background-size: 55px 55px;
    }

    .date-label {
      width: fit-content;
      margin: 7px auto 14px;
      background: rgba(40,55,70,.85);
      color: #c4ccd4;
      padding: 5px 11px;
      border-radius: 12px;
      font-size: 12px;
    }

    .message-row {
      display: flex;
      width: 100%;
      margin-bottom: 7px;
    }

    .sent {
      justify-content: flex-end;
    }

    .received {
      justify-content: flex-start;
    }

    .bubble {
      max-width: 78%;
      padding: 8px 10px 5px;
      border-radius: 10px;
      word-wrap: break-word;
      overflow-wrap: anywhere;
      box-shadow: 0 1px 1px rgba(0,0,0,.18);
    }

    .sent .bubble {
      background: #2b5278;
      border-bottom-right-radius: 3px;
    }

    .received .bubble {
      background: #182533;
      border-bottom-left-radius: 3px;
    }

    .message-text {
      font-size: 16px;
      line-height: 1.35;
      white-space: pre-wrap;
    }

    .message-meta {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 4px;
      margin-top: 3px;
    }

    .message-time {
      font-size: 11px;
      color: #aebbc7;
    }

    .ticks {
      color: #62b5f5;
      font-size: 14px;
    }

    /* NAME BOX */

    .name-box {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%,-50%);
      width: calc(100% - 40px);
      max-width: 360px;

      background: #17212b;
      padding: 22px;
      border-radius: 16px;

      box-shadow: 0 8px 35px rgba(0,0,0,.5);

      z-index: 100;
    }

    .name-box h2 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .name-box p {
      font-size: 14px;
      color: #9daab6;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    .name-input {
      width: 100%;
      height: 46px;

      background: #242f3a;
      border: 1px solid #394754;
      border-radius: 10px;

      padding: 0 13px;

      color: white;
      outline: none;
      font-size: 16px;
    }

    .name-input::placeholder {
      color: #7f8c98;
    }

    .name-buttons {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .name-button {
      flex: 1;
      height: 42px;
      border: none;
      border-radius: 9px;
      cursor: pointer;
      font-size: 15px;
    }

    .continue {
      background: #2aabee;
      color: white;
    }

    .skip {
      background: #263441;
      color: #c5cdd4;
    }

    /* BOTTOM COMPOSER */

    .composer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;

      min-height: 66px;
      padding: 8px 9px;

      background: #17212b;

      display: flex;
      align-items: flex-end;
      gap: 7px;

      z-index: 20;
    }

    .input-container {
      flex: 1;
      min-height: 48px;

      background: #242f3a;
      border-radius: 24px;

      display: flex;
      align-items: center;

      padding: 0 15px;
    }

    textarea {
      width: 100%;
      min-height: 24px;
      max-height: 120px;

      resize: none;
      border: none;
      outline: none;

      background: transparent;
      color: white;

      font-family: inherit;
      font-size: 16px;
      line-height: 24px;
    }

    textarea::placeholder {
      color: #7f8c98;
    }

    .send-button {
      width: 48px;
      height: 48px;
      min-width: 48px;

      border: none;
      border-radius: 50%;

      background: #2aabee;
      color: white;

      font-size: 22px;

      display: flex;
      align-items: center;
      justify-content: center;

      cursor: pointer;
    }

    .send-button:disabled {
      opacity: .5;
    }

    /* CREATED BY */

    .created-by {
      position: fixed;
      top: 70px;
      right: 9px;

      font-size: 9px;
      color: rgba(255,255,255,.3);

      z-index: 5;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <!-- HEADER -->

  <div class="header">

    <div class="back" onclick="history.back()">
      ‹
    </div>

    <div class="avatar">
      AN
    </div>

    <div class="header-info">

      <div
        class="header-name"
        id="headerName"
      >
        Anonymous
      </div>

      <div
        class="header-status offline"
        id="status"
      >
        offline
      </div>

    </div>

    <div class="menu">
      ⋮
    </div>

  </div>


  <div class="created-by">
    Created by Gourab
  </div>


  <!-- CHAT -->

  <main class="chat" id="chat">

    <div class="date-label">
      Today
    </div>

    <div id="messages"></div>

  </main>


  <!-- MESSAGE BOX -->

  <div class="composer">

    <div class="input-container">

      <textarea
        id="messageInput"
        placeholder="Message"
        rows="1"
        maxlength="2000"
      ></textarea>

    </div>

    <button
      class="send-button"
      id="sendButton"
      onclick="sendMessage()"
    >
      ➤
    </button>

  </div>


  <!-- NAME POPUP -->

  <div
    class="name-box"
    id="nameBox"
  >

    <h2>Welcome 👋</h2>

    <p>
      You can enter your name before starting
      the conversation. You can also continue
      anonymously.
    </p>

    <input
      id="nameInput"
      class="name-input"
      type="text"
      maxlength="50"
      placeholder="Your name"
      autocomplete="off"
    >

    <div class="name-buttons">

      <button
        class="name-button skip"
        onclick="continueAnonymous()"
      >
        Anonymous
      </button>

      <button
        class="name-button continue"
        onclick="saveName()"
      >
        Continue
      </button>

    </div>

  </div>


<script>

  /* SESSION */

  let sessionId =
    localStorage.getItem(
      "anonymousSessionId"
    );

  if (!sessionId) {

    sessionId =
      crypto.randomUUID
        ? crypto.randomUUID()
        : Date.now().toString(36) +
          Math.random()
            .toString(36)
            .substring(2);

    localStorage.setItem(
      "anonymousSessionId",
      sessionId
    );
  }


  /* ELEMENTS */

  const chat =
    document.getElementById("chat");

  const messagesBox =
    document.getElementById("messages");

  const input =
    document.getElementById("messageInput");

  const sendButton =
    document.getElementById("sendButton");

  const nameBox =
    document.getElementById("nameBox");

  const nameInput =
    document.getElementById("nameInput");

  const headerName =
    document.getElementById("headerName");

  const status =
    document.getElementById("status");


  /* NAME */

  let visitorName =
    localStorage.getItem(
      "visitorName"
    );


  function continueAnonymous() {

    localStorage.removeItem(
      "visitorName"
    );

    visitorName = "";

    headerName.textContent =
      "Anonymous";

    nameBox.style.display =
      "none";

  }


  function saveName() {

    const name =
      nameInput.value.trim();

    if (!name) {

      nameInput.focus();

      return;

    }

    visitorName = name;

    localStorage.setItem(
      "visitorName",
      name
    );

    /*
     * IMPORTANT:
     * The header becomes GOURAB,
     * not the visitor's name.
     */

    headerName.textContent =
      "Gourab";

    nameBox.style.display =
      "none";

  }


  /*
   * If a name was already entered
   * on this device, don't show popup.
   */

  if (visitorName) {

    headerName.textContent =
      "Gourab";

    nameBox.style.display =
      "none";

  }


  /* STATUS */

  function setOnline() {

    status.textContent =
      "online";

    status.className =
      "header-status online";

  }


  function setOffline() {

    status.textContent =
      "offline";

    status.className =
      "header-status offline";

  }


  /*
   * Connection status.
   *
   * This means the visitor's connection
   * to the website is working.
   */

  async function checkConnection() {

    try {

      const response =
        await fetch(
          "/conversation/" +
          encodeURIComponent(sessionId),
          {
            cache: "no-store"
          }
        );

      if (response.ok) {

        setOnline();

      } else {

        setOffline();

      }

    } catch {

      setOffline();

    }

  }


  /* TIME */

  function formatTime(value) {

    const date =
      new Date(value);

    if (isNaN(date.getTime())) {
      return "";
    }

    return date.toLocaleTimeString(
      [],
      {
        hour: "numeric",
        minute: "2-digit"
      }
    );
  }


  /* ESCAPE HTML */

  function escapeHtml(text) {

    const div =
      document.createElement("div");

    div.textContent =
      text;

    return div.innerHTML;
  }


  /* DISPLAY MESSAGES */

  function displayMessages(messages) {

    messagesBox.innerHTML = "";

    if (!messages ||
        messages.length === 0) {

      return;

    }


    const sorted =
      [...messages].sort(
        (a,b) =>
          new Date(a.time) -
          new Date(b.time)
      );


    sorted.forEach(message => {

      const isSent =
        message.sender === "visitor" ||
        message.sender === "user" ||
        message.sender === "sent";


      const row =
        document.createElement("div");

      row.className =
        "message-row " +
        (isSent
          ? "sent"
          : "received");


      const bubble =
        document.createElement("div");

      bubble.className =
        "bubble";


      const text =
        document.createElement("div");

      text.className =
        "message-text";

      text.innerHTML =
        escapeHtml(
          message.text || ""
        );


      const meta =
        document.createElement("div");

      meta.className =
        "message-meta";


      const time =
        document.createElement("span");

      time.className =
        "message-time";

      time.textContent =
        formatTime(
          message.time
        );


      meta.appendChild(time);


      if (isSent) {

        const ticks =
          document.createElement("span");

        ticks.className =
          "ticks";

        ticks.textContent =
          "✓✓";

        meta.appendChild(ticks);

      }


      bubble.appendChild(text);
      bubble.appendChild(meta);

      row.appendChild(bubble);

      messagesBox.appendChild(row);

    });


    requestAnimationFrame(() => {

      chat.scrollTop =
        chat.scrollHeight;

    });

  }


  /* LOAD CONVERSATION */

  async function loadConversation() {

    try {

      const response =
        await fetch(
          "/conversation/" +
          encodeURIComponent(sessionId),
          {
            cache: "no-store"
          }
        );


      if (!response.ok) {

        setOffline();

        return;

      }


      setOnline();


      const data =
        await response.json();


      displayMessages(
        data.messages || []
      );


    } catch (error) {

      setOffline();

      console.log(error);

    }

  }


  /* SEND */

  async function sendMessage() {

    const message =
      input.value.trim();


    if (!message) {
      return;
    }


    sendButton.disabled = true;

    input.disabled = true;


    try {

      const response =
        await fetch(
          "/message",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({

              sessionId:
                sessionId,

              name:
                visitorName || "Anonymous",

              message:
                message

            })

          }
        );


      const data =
        await response.json();


      if (!response.ok ||
          !data.success) {

        throw new Error(
          data.error ||
          "Message failed"
        );

      }


      input.value = "";

      input.style.height =
        "auto";


      await loadConversation();

      input.focus();


    } catch (error) {

      alert(
        "Message could not be sent."
      );

      console.error(error);

    } finally {

      sendButton.disabled =
        false;

      input.disabled =
        false;

    }

  }


  /* ENTER TO SEND */

  input.addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();

      }

    }
  );


  /* AUTO HEIGHT */

  input.addEventListener(
    "input",
    function() {

      this.style.height =
        "auto";

      this.style.height =
        Math.min(
          this.scrollHeight,
          120
        ) + "px";

    }
  );


  /* START */

  loadConversation();

  setInterval(
    loadConversation,
    3000
  );

</script>

</body>
</html>
